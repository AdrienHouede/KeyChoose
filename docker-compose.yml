version: "3.8"

services:
    api:
        build: ./api
        ports:
            - "${API_PORT}:${API_PORT}"
        env_file:
            - .env
        environment:
            - DB_HOST=db
            - DB_USER=${MYSQL_USER}
            - DB_PASS=${MYSQL_PASSWORD}
            - DB_NAME=${MYSQL_DATABASE}
            - JWT_SECRET=${JWT_SECRET}
        volumes:
            - ./api:/app
        depends_on:
            - db
        restart: always
        networks:
            - keychoose-network

  # client:
  #   build: ./client
  #   ports:
  #     - "${CLIENT_PORT}:${CLIENT_PORT}"
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./client:/app
  #     - /app/node_modules
  #   stdin_open: true
  #   tty: true
  #   restart: always
  #   networks:
  #     - keychoose-network

    db:
        image: mysql:8.0
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
        ports:
            - "${MYSQL_PORT}:3306"
        volumes:
            - dbdata:/var/lib/mysql
            - ./mysql-init:/docker-entrypoint-initdb.d
        networks:
            - keychoose-network

volumes:
    dbdata:

networks:
    keychoose-network:
        driver: bridge